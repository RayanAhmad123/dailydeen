# Fully unattended daily Ayah video: pick next unused ayah -> build props ->
# render with Remotion -> publish PUBLIC to YouTube + TikTok via PostPeer ->
# commit advanced state back to main. No local machine needed.
#
# Media the repo can't hold (gitignored): recitation mp3s + pre-rendered,
# frame-reviewed footage montages live as tarballs on the `cloud-assets`
# GitHub release. Top-up procedure when the ayah bank runs low:
#   1. locally: python3 scripts/fetch_ayat.py            (extend the bank)
#   2. plan shots in content/montages.json, then python3 scripts/build_montages.py
#   3. frame-review the new assets/prerendered/*.mp4
#   4. tar + `gh release upload cloud-assets ... --clobber` (see release notes)
# When the bank is exhausted, build_ayah.py exits nonzero -> this workflow
# fails -> GitHub emails the repo owner. Nothing gets double-posted:
# upload_postpeer.py is idempotent per caption, and state only lands on main
# after a fully successful run.
name: daily-video

on:
  # PRIMARY TRIGGER: a claude.ai cloud routine pushes a timestamp to
  # .github/trigger-daily every morning. GitHub's cron scheduler NEVER fired
  # for this repo (5/5 schedule events dropped 07-14..07-16, config verified
  # clean, disable/enable re-registration didn't help) — push events are real
  # webhooks and fire reliably. The bot's own state commits don't touch this
  # path, so no trigger loop.
  push:
    branches: [main]
    paths: [".github/trigger-daily"]
  # Kept as a free extra chance in case GitHub's scheduler ever heals; the
  # already-posted-today guard makes any duplicate fire cancel itself.
  # Just-after-00:00-UTC slot on purpose: PostPeer's TikTok app has a daily
  # active-user cap that resets at 00:00 UTC and drains within hours. It killed
  # the TikTok leg at the old ~07:26 UTC slot (Jul 24, 29-31), then caught up
  # with the 04:26 UTC slot too — 7 silent losses, Aug 27..Sep 2. Only the first
  # hour after the reset is safe. A run outside it is NOT lost: upload_postpeer's
  # tt_publish_when() hands TikTok to PostPeer's scheduler for the next 00:05
  # UTC, exactly like the YouTube leg, whose own quota (100 uploads/day shared
  # across all PostPeer users) resets at midnight Pacific instead (QUOTA SPLIT).
  schedule:
    - cron: "10 0 * * *"   # 00:10 UTC — inside TikTok's fresh cap window
    - cron: "40 0 * * *"   # 00:40 UTC backup
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + render only (no posting, no state push); upload the mp4 as an artifact"
        type: boolean
        default: false

concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # the already-posted guard cancels its own run

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # enough history for the already-posted-today guard to see the last
          # state commit (the bot commits state/ daily, so it's always near HEAD)
          fetch-depth: 50

      # Makes duplicate fires (backup cron, manual dispatch after a cron run,
      # delayed cron after a manual run) harmless: exactly one post per day.
      # Dry runs are exempt — they never post or push state.
      - name: Stop if today's video was already posted
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_POST=$(git log -1 --format=%cs -- state/)
          if [ "$LAST_POST" = "$(date -u +%F)" ]; then
            echo "state/ already advanced today ($LAST_POST) — cancelling this run."
            gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
            sleep 120           # cancellation is async; wait for it to land
            exit 1              # backstop: never fall through to a second post
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # fonts-hosny-amiri + noto: system fallback for Arabic glyphs (Quranic
          # annotation marks) missing from the Google Fonts webfont subset —
          # without it headless Chrome on Linux renders tofu boxes in the ayah.
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-hosny-amiri fonts-noto-core fonts-noto-ui-core
          pip install -q requests
          npm ci

      - name: Download cloud assets (recitations + pre-rendered montages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cloud-assets --pattern '*.tar.gz' --dir /tmp/cloud-assets
          mkdir -p assets
          tar -xzf /tmp/cloud-assets/recitations.tar.gz -C assets
          tar -xzf /tmp/cloud-assets/prerendered.tar.gz -C assets
          ls assets/recitations assets/prerendered

      # Bank topped up in git but the tarball not re-uploaded yet: fetch just the
      # next ayah's recitation (same source/concat as fetch_ayat.py). Without its
      # own prerendered montage, build_ayah.py re-cuts existing ones and the alert
      # step below emails about it (weekly) until the release is re-uploaded.
      - name: Fetch a recitation missing from the release
        run: python3 scripts/ensure_recitations.py

      - name: Build ayah props (fails when the bank is exhausted)
        run: python3 scripts/build_ayah.py

      - name: Render
        run: |
          VID=$(python3 -c "import json;print(json.load(open('work/script.json'))['id'])")
          echo "VID=$VID" >> "$GITHUB_ENV"
          npx remotion render AyahVideo --props=src/ayahData.json --output="output/videos/$VID.mp4"

      - name: Upload render as artifact (dry run only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VID }}
          path: |
            output/videos/${{ env.VID }}.mp4
            output/videos/${{ env.VID }}.meta.json
            src/ayahData.json

      - name: Publish via PostPeer (YouTube + TikTok, public)
        if: ${{ !inputs.dry_run }}
        env:
          POSTPEER_API_KEY: ${{ secrets.POSTPEER_API_KEY }}
        run: python3 scripts/upload_postpeer.py

      # Public view counts (no login) -> state/views.json, committed with the state
      # below. The OAuth analytics loop only runs on the Mac, so this is what keeps
      # a readable record in the repo. Best-effort: it never fails the run.
      - name: Track public view counts
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/public_stats.py

      - name: Commit state to main
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "daily-video-bot"
          git config user.email "actions@github.com"
          git add state/ src/ayahData.json
          git commit -m "Ayah video $VID (automated daily run)"
          git pull --rebase origin main
          # Push can race with its own retry ("cannot lock ref ... is at <our
          # commit>", seen 2026-07-15): the ref updates but the client reports
          # rejection. Only swallow the error when main already IS our commit.
          git push origin HEAD:main || {
            git fetch origin main
            [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] \
              && echo "push race: commit already on main" || exit 1
          }

      # upload_postpeer.py stays exit-0 on platform-level failures so the state
      # commit above still lands (a lost leg must not stall tomorrow's video).
      # This step turns those failures — plus problems its reconcile pass found
      # in earlier posts (a scheduled YouTube leg that died, an extra copy) —
      # into a failed run, so GitHub emails the owner. It also raises
      # build_ayah.py's footage warning (no montage shipped for today's ayah, so
      # existing ones were re-cut, or none at all): at most once a week while the
      # stand-in footage lasts, every time a video goes out with no footage.
      - name: Alert if a publish leg failed or the footage is a stand-in
        if: ${{ !inputs.dry_run }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          res = json.load(open("work/postpeer_result.json"))
          bad = [l for l in res.get("legs", []) if not l.get("success")]
          bad += res.get("problems", [])
          for b in bad:
              print(f"PUBLISH PROBLEM: {b}")
          warn = (json.load(open("work/build_warnings.json"))
                  if os.path.exists("work/build_warnings.json") else {})
          for w in warn.get("warnings", []):
              print(f"::warning::FOOTAGE: {w}")
          if warn.get("alert"):
              bad += warn["warnings"]
          if bad:
              sys.exit(f"{len(bad)} problem(s) — see above. State already "
                       "advanced; publish fixes per scripts/upload_postpeer.py docstring, "
                       "footage per scripts/build_montages.py.")
          print("all publish legs OK")
          EOF

      # PostPeer's backend can double-publish a single post request (seen
      # 2026-07-19: one API call, two YouTube uploads 6s apart — likely their
      # internal retry on a slow upload). We can't prevent or delete it without
      # YouTube write credentials, so the run fails (-> GitHub email) and the
      # owner deletes the extra in Studio. Copies PostPeer itself records are
      # caught by upload_postpeer.py's reconcile pass; copies it doesn't are
      # caught by public_stats.py, which compares the newest Shorts on the
      # channel tab by title on the NEXT day's run (the YouTube leg publishes
      # ~08:10 UTC, hours after this job, and the RSS feed this step used to
      # read 404s for runner IPs most days, so the old same-run check never
      # saw anything). Each duplicate is reported once. Runs AFTER the state
      # commit on purpose: a duplicate must not stop tomorrow's run.
      - name: Alert if the platform double-published a video
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          p = "work/stats_alerts.json"
          alerts = json.load(open(p)).get("alerts", []) if os.path.exists(p) else []
          for a in alerts:
              print(a)
          if alerts:
              sys.exit(f"{len(alerts)} duplicate upload(s) — see above.")
          print("no duplicate uploads on the channel")
          EOF
